<!DOCTYPE html>
<html lang="zh-tw">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>千穹日記 - ちそらにっき</title>
        <link rel="icon" type="image/png" href="items/icons/icon-web.png">
        <link rel="stylesheet" href="style.css?v=20261124-3">
    </head>

    <body class="github-body">
        <!-- 橫幅 -->
        <header class="top-banner"> 
            <div class="banner-slide">
                <p role="status">橫幅載入中…</p>
            </div>
            <div class="banner-progress" id="banner-progress" aria-hidden="true"></div>
        </header>
        
        <!-- 主要佈局 -->
        <div class="main-layout"> 
            <!-- 左側欄 -->
            <aside class="sidebar">
                <!-- 個人資料卡 -->
                <div class="profile-card"> 
                    <div class="profile-image"> 
                        <img class="card-avatar" src="items/Avatar.jpg" alt="Image-Avatar">
                        <button type="button" class="secret-toggle" id="secret-toggle" aria-label="<みらい>"></button>
                    </div>
                    
                    <h2 class="profile-name" id="profile-name"><ruby>Terry <rt>テリー</rt></ruby> <ruby>Weng<rt>オウ</rt></ruby></h2>
                    <div class="name-divider" id="name-divider"></div>
                    <p class="profile-bio" id="profile-bio">Small White・He/Him</p>

                    <!-- 社交鏈接 -->
                    <div class="social-links"> 
                            <a class="icon-btn" href="https://github.com/SmallWhite9487" target="_blank" title="GitHub">
                                <img src="items/icons/icon-github.png" alt="ICON-GitHub">
                            </a>
                            <a class="icon-btn" href="https://forms.gle/UdbqFBGMmfMfpLYX6" target="_blank" title="Gmail">
                                <img src="items/icons/icon-gmail.webp" alt="ICON-Gmail">
                            </a>

                            <a class="icon-btn" href="https://discord.com/users/smallwhite9487" target="_blank" title="Discord">
                                <img src="items/icons/icon-discord.png" alt="ICON-Discord">
                            </a>
                    </div>
                </div>

                <!-- 倒數小卡片 -->
                <div class="time-card">
                    <div class="time-label">東京時間・UTC+9</div>
                    <div class="tokyo-time" id="tokyo-time">--:--:--</div>
                    <div class="countdown" id="countdown">載入中…</div>
                </div>
                <nav class="article-toc" id="article-toc" aria-label="文章目錄" hidden>
                    <h2>文章目錄</h2>
                    <ul id="article-toc-list"></ul>
                </nav>
            </aside>

            <!-- 右側欄 博客列表 -->
            <main class="blog-list">
                <div id="blog-list"></div>
                <section id="article-reader" class="article-reader" hidden>
                    <div class="reader-toolbar">
                        <button type="button" class="back-to-list" id="back-to-list">← 返回文章列表</button>
                        <button type="button" class="furigana-setting" id="show-furigana" aria-controls="article-content" aria-pressed="false">顯示假名：關閉</button>
                    </div>
                    <p class="reading-preference-status" id="reading-preference-status" role="status" hidden></p>
                    <div id="article-content" class="article-content" aria-live="polite"></div>
                </section>
            </main>
        </div>
        
        <!--版權說明-->
        <footer>
            <p>&copy; 2026 Small White. All rights reserved.</p>
            <div class="footer-divider" id="footer-divider"></div>
            <p>Powered by <a href="https://github.com/SmallWhite9487/Small-Blog">Github</a> & Cloudflare Pages</p>
        </footer>

        <dialog id="poster-preview" class="poster-preview" aria-label="海報預覽">
            <img id="poster-preview-image" alt="">
            <form method="dialog">
                <button type="submit" class="poster-preview-close" aria-label="關閉海報預覽" autofocus>×</button>
            </form>
        </dialog>

        <!-- 手機版評分卡詳情 -->
        <dialog id="mini-view-modal" class="mini-view-modal" aria-labelledby="mini-view-modal-title">
            <div class="mini-view-modal-panel">
                <header class="mini-view-modal-header">
                    <img id="mini-view-modal-poster" alt="" hidden>
                    <div class="mini-view-modal-meta">
                        <h2 id="mini-view-modal-title"></h2>
                        <div id="mini-view-modal-rating"></div>
                    </div>
                    <form method="dialog">
                        <button type="submit" class="poster-preview-close" aria-label="關閉作品詳情" autofocus>×</button>
                    </form>
                </header>
                <div id="mini-view-modal-comment" class="mini-view-comment" role="region" aria-label="評論" tabindex="0"></div>
            </div>
        </dialog>

        <!-- 腳本 -->
        <script src="timer-profile.js"></script>
        <script src="banner.js?v=20261123-1"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" integrity="sha384-JEyTNhjM6R1ElGoJns4U2Ln4ofPcqzSsynQkmEc/KGy6336qAZl70tDLufbkla+3" crossorigin="anonymous"></script>
        <script src="markdown-extensions.js?v=20261119-6"></script>
        <script src="blog.js?v=20261119-5"></script>
    </body>
</html>
